<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generator Etykiet na Słoiki</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      display: flex;
      gap: 40px;
      background-color: #f4f4f9;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #ccc;
    }
    .controls {
      width: 300px;
      flex-shrink: 0;
    }
    button {
      margin-top: 10px;
      padding: 12px;
      width: 100%;
      font-size: 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
    .row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    /* Preview now gets its width/height set in JS (in px, scaled from the
       real mm size of the chosen label) so it visually shrinks/grows with
       the selected label size instead of staying a fixed 400x300 box. */
    .preview {
      border: 2px solid #888;
      background-color: var(--bg-color, #fff8dc);
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      position: relative;
      overflow: hidden;
      font-family: Arial, sans-serif;
      flex-shrink: 0;
    }

    /* Name/date are absolutely positioned + sized in JS using the same
       proportional layout math used for the PDF, so what you see here is
       what comes out the other end. */
    .preview-field {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      box-sizing: border-box;
      line-height: 1.05;
      white-space: nowrap;
    }
    #preview-name { font-weight: bold; }
    #preview-date { font-weight: normal; }

    #preview-image-box {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #preview-img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      display: block;
    }
    #emoji-preview {
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <meta name="google-site-verification" content="_g4QYPTjOx8OLWzW-odqA4K1Nm5L35HxARs1b5tUjTk" />
</head>
<body>
  <div class="controls">
    <label for="name">Nazwa przetworu:</label>
    <input type="text" id="name" placeholder="np. Dżem truskawkowy" />

    <label for="date">Data:</label>
    <div class="row">
      <input type="text" id="date" placeholder="np. 5 lipca 2025" />
      <button type="button" onclick="setToday()" style="width:auto; padding: 10px;">Dziś</button>
    </div>

    <label for="size">Rozmiar etykiety:</label>
    <select id="size">
      <option value="100x50">100x50 mm</option>
      <option value="80x40">80x40 mm</option>
      <option value="60x30">60x30 mm</option>
      <option value="70x35">70x35 mm</option>
      <option value="90x45">90x45 mm</option>
      <option value="120x60">120x60 mm</option>
    </select>

    <label for="quantity">Ilość etykiet:</label>
    <input type="number" id="quantity" value="1" min="1" />

    <label for="preset-image">Wybierz obrazek:</label>
    <select id="preset-image">
      <option value="">(brak)</option>
      <option value="🍓">Truskawka</option>
      <option value="🍒">Wiśnia</option>
      <option value="🍎">Jabłko</option>
      <option value="🍑">Brzoskwinia</option>
      <option value="🍐">Gruszka</option>
      <option value="🍇">Winogrona</option>
      <option value="🍍">Ananas</option>
      <option value="🥭">Mango</option>
      <option value="🍌">Banan</option>
    </select>

    <label for="image">Lub załaduj własny obrazek:</label>
    <input type="file" id="image" accept="image/*" />

    <label for="bg-color">Kolor tła etykiety: (domyślnie: biały)</label>
    <select id="bg-color">
      <option value="#fff8dc">Kremowy</option>
      <option value="#e0f7fa">Błękitny</option>
      <option value="#e8f5e9">Miętowy</option>
      <option value="#fce4ec">Różowy</option>
      <option value="#fff" selected>Biały</option>
      <option value="#f0f0f0">Jasnoszary</option>
    </select>

    <button onclick="generatePDF()">Eksportuj jako PDF</button>
  </div>

  <div class="preview" id="preview">
    <div id="preview-image-box">
      <div id="emoji-preview" style="display:none;"></div>
      <img id="preview-img" style="display:none;" />
    </div>
    <strong id="preview-name" class="preview-field"></strong>
    <span id="preview-date" class="preview-field"></span>
  </div>

      y += nameH + gap;

      const m = /^data:image\/(\w+);/.exec(dataUrl || "");
      if (!m) return "PNG";
      const t = m[1].toLowerCase();
      if (t === "jpeg" || t === "jpg") return "JPEG";
      if (t === "webp") return "WEBP";
      return "PNG";
    }

    const measureCanvas = document.createElement("canvas");
    const measureCtx = measureCanvas.getContext("2d");
    function measureTextPreview(text, fontSizePx, weight) {
      measureCtx.font = (weight || "normal") + " " + fontSizePx + "px Arial, sans-serif";
      return measureCtx.measureText(text).width;
    }

    nameInput.addEventListener("input", updatePreview);
    dateInput.addEventListener("input", updatePreview);
    sizeSelect.addEventListener("change", updatePreview);
    imageInput.addEventListener("change", handleImage);
    emojiSelect.addEventListener("change", handleEmoji);
    bgColorSelect.addEventListener("change", updateStyle);

    function getLabelSizeMm() {
      const parts = sizeSelect.value.split("x").map(Number);
      return { w: parts[0], h: parts[1] };
    }

    function updatePreview() {
      const name = nameInput.value || "(nazwa)";
      const date = dateInput.value || "(data)";
      const mm = getLabelSizeMm();
      const widthPx = mm.w * PX_PER_MM;
      const heightPx = mm.h * PX_PER_MM;

      preview.style.width = widthPx + "px";
      preview.style.height = heightPx + "px";

      const hasImage = !!(imageDataUrl || selectedEmoji);
      const boxes = computeBoxes(widthPx, heightPx, hasImage);

      if (boxes.imageBox) {
        previewImageBox.style.display = "flex";
        previewImageBox.style.left = boxes.imageBox.x + "px";
        previewImageBox.style.top = boxes.imageBox.y + "px";
        previewImageBox.style.width = boxes.imageBox.w + "px";
        previewImageBox.style.height = boxes.imageBox.h + "px";
        if (selectedEmoji && !imageDataUrl) {
          emojiPreview.style.fontSize = Math.round(boxes.imageBox.h * 0.75) + "px";
        }
      } else {
        previewImageBox.style.display = "none";
      }

      previewName.textContent = name;
      previewName.style.left = boxes.nameBox.x + "px";
      previewName.style.top = boxes.nameBox.y + "px";
      previewName.style.width = boxes.nameBox.w + "px";
      previewName.style.height = boxes.nameBox.h + "px";
      const nameSize = fitFontSize(
        function (t, s) { return measureTextPreview(t, s, "bold"); },
        name, boxes.nameBox.w * 0.95, boxes.nameBox.h, 9
      );
      previewName.style.fontSize = nameSize + "px";

      previewDate.textContent = date;
      previewDate.style.left = boxes.dateBox.x + "px";
      previewDate.style.top = boxes.dateBox.y + "px";
      previewDate.style.width = boxes.dateBox.w + "px";
      previewDate.style.height = boxes.dateBox.h + "px";
      const dateSize = fitFontSize(
        function (t, s) { return measureTextPreview(t, s, "normal"); },
        date, boxes.dateBox.w * 0.95, boxes.dateBox.h, 7
      );
      previewDate.style.fontSize = dateSize + "px";
    }

    function updateStyle() {
      preview.style.setProperty("--bg-color", bgColorSelect.value);
    }

    function handleImage(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        imageDataUrl = e.target.result;
        const img = new Image();
        img.onload = function () {
          imageNaturalSize = { w: img.naturalWidth, h: img.naturalHeight };
          previewImg.src = imageDataUrl;
          previewImg.style.display = "block";
          emojiPreview.style.display = "none";
          selectedEmoji = "";
          updatePreview();
        };
        img.src = imageDataUrl;
      };
      reader.readAsDataURL(file);
    }

    function handleEmoji() {
      selectedEmoji = emojiSelect.value;
      imageDataUrl = null;
      imageNaturalSize = null;
      previewImg.style.display = "none";
      emojiPreview.style.display = selectedEmoji ? "flex" : "none";
      emojiPreview.textContent = selectedEmoji;
      updatePreview();
    }

    function setToday() {
      const today = new Date();
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      const formatted = today.toLocaleDateString('pl-PL', options);
      dateInput.value = formatted.charAt(0).toUpperCase() + formatted.slice(1);
      updatePreview();
    }

    function emojiToDataUrl(emoji, sizePx) {
      const canvas = document.createElement('canvas');
      canvas.width = sizePx;
      canvas.height = sizePx;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, sizePx, sizePx);
      ctx.font = (sizePx - sizePx * 0.15) + 'px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", "Android Emoji", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(emoji, sizePx / 2, sizePx / 2);
      return canvas.toDataURL('image/png');
    }

    async function generatePDF() {
      const jsPDF = window.jspdf.jsPDF;
      // A4 w punktach (pt): 210x297 mm * 2.83465 = 595.28 x 841.89 pt
      const pageWidth = 595.28;
      const pageHeight = 841.89;
      const doc = new jsPDF({ unit: 'pt', format: 'a4', orientation: 'portrait' });

      // Register the embedded Unicode font (regular + bold) before doing
      // anything else, so all later measuring/drawing can use it.
      doc.addFileToVFS("NotoSans-Regular.ttf", NOTO_REGULAR_B64);
      doc.addFont("NotoSans-Regular.ttf", "NotoSans", "normal");
      doc.addFileToVFS("NotoSans-Bold.ttf", NOTO_BOLD_B64);
      doc.addFont("NotoSans-Bold.ttf", "NotoSans", "bold");

      const name = nameInput.value || "(nazwa)";
      const date = dateInput.value || "(data)";
      const size = sizeSelect.value;
      const quantity = parseInt(document.getElementById("quantity").value) || 1;
      const bgColor = getComputedStyle(preview).getPropertyValue('--bg-color').trim();

      const sizeParts = size.split("x").map(Number);
      const labelWidthMm = sizeParts[0], labelHeightMm = sizeParts[1];
      const mmToPt = 2.83465;
      const labelWidth = labelWidthMm * mmToPt;
      const labelHeight = labelHeightMm * mmToPt;

      // Ile etykiet w poziomie i pionie się zmieści
      const labelsPerRow = Math.floor(pageWidth / labelWidth);
      const labelsPerCol = Math.floor(pageHeight / labelHeight);

      const hasImage = !!(imageDataUrl || selectedEmoji);
      const boxes = computeBoxes(labelWidth, labelHeight, hasImage);
      const cornerRadius = Math.min(14, Math.min(labelWidth, labelHeight) * 0.06);

      function measureTextPDF(text, fontSize, style) {
        doc.setFont("NotoSans", style);
        doc.setFontSize(fontSize);
        return doc.getTextWidth(text);
      }

      // Font sizes are computed ONCE per export, scaled to fit THIS label
      // size - this is what stops small labels from overflowing.
      const nameFontSize = fitFontSize(
        function (t, s) { return measureTextPDF(t, s, "bold"); },
        name, boxes.nameBox.w * 0.95, boxes.nameBox.h, 7
      );
      const dateFontSize = fitFontSize(
        function (t, s) { return measureTextPDF(t, s, "normal"); },
        date, boxes.dateBox.w * 0.95, boxes.dateBox.h, 6
      );

      // Pre-render the image/emoji once - the same bitmap is reused for
      // every copy of the label instead of being rebuilt each time.
      let imageForPdf = null;
      if (imageDataUrl && boxes.imageBox && imageNaturalSize) {
        const fit = fitRectContain(boxes.imageBox, imageNaturalSize.w, imageNaturalSize.h);
        imageForPdf = {
          dataUrl: imageDataUrl,
          format: getImageFormat(imageDataUrl),
          x: fit.x, y: fit.y, w: fit.w, h: fit.h
        };
      } else if (selectedEmoji && boxes.imageBox) {
        const side = Math.min(boxes.imageBox.w, boxes.imageBox.h);
        const sizePx = Math.round(side * (300 / 72)); // ~300dpi for crisp print
        const dataUrl = emojiToDataUrl(selectedEmoji, Math.min(600, Math.max(120, sizePx)));
        imageForPdf = {
          dataUrl: dataUrl,
          format: "PNG",
          x: boxes.imageBox.x + (boxes.imageBox.w - side) / 2,
          y: boxes.imageBox.y + (boxes.imageBox.h - side) / 2,
          w: side, h: side
        };
      }

      let printed = 0;
      while (printed < quantity) {
        for (let row = 0; row < labelsPerCol; row++) {
          for (let col = 0; col < labelsPerRow; col++) {
            if (printed >= quantity) break;

            const x = col * labelWidth;
            const y = row * labelHeight;

            doc.setFillColor(bgColor);
            doc.roundedRect(x, y, labelWidth, labelHeight, cornerRadius, cornerRadius, 'F');
            doc.setDrawColor(100);
            doc.setLineWidth(1.5);
            doc.roundedRect(x, y, labelWidth, labelHeight, cornerRadius, cornerRadius);

            // Linie do wycinania (crop marks)
            const markLen = 10;
            const markOffset = 2;
            doc.setDrawColor(0);
            doc.setLineWidth(0.5);

            // Górne lewo
            doc.line(x - markOffset, y, x - markOffset, y - markLen);
            doc.line(x - markOffset, y - markOffset, x - markLen, y - markOffset);
            // Górne prawo
            doc.line(x + labelWidth + markOffset, y, x + labelWidth + markOffset, y - markLen);
            doc.line(x + labelWidth + markOffset, y - markOffset, x + labelWidth + markLen, y - markOffset);
            // Dolne lewo
            doc.line(x - markOffset, y + labelHeight, x - markOffset, y + labelHeight + markLen);
            doc.line(x - markOffset, y + labelHeight + markOffset, x - markLen, y + labelHeight + markOffset);
            // Dolne prawo
            doc.line(x + labelWidth + markOffset, y + labelHeight, x + labelWidth + markOffset, y + labelHeight + markLen);
            doc.line(x + labelWidth + markOffset, y + labelHeight + markOffset, x + labelWidth + markLen, y + labelHeight + markOffset);

            // Obrazek / emoji
            if (imageForPdf) {
              doc.addImage(
                imageForPdf.dataUrl,
                imageForPdf.format,
                x + imageForPdf.x,
                y + imageForPdf.y,
                imageForPdf.w,
                imageForPdf.h
              );
            }

            // Nazwa
            doc.setFont("NotoSans", "bold");
            doc.setFontSize(nameFontSize);
            doc.text(
              name,
              x + boxes.nameBox.x + boxes.nameBox.w / 2,
              y + boxes.nameBox.y + boxes.nameBox.h / 2,
              { align: 'center', baseline: 'middle' }
            );

            // Data
            doc.setFont("NotoSans", "normal");
            doc.setFontSize(dateFontSize);
            doc.text(
              date,
              x + boxes.dateBox.x + boxes.dateBox.w / 2,
              y + boxes.dateBox.y + boxes.dateBox.h / 2,
              { align: 'center', baseline: 'middle' }
            );

            printed++;
          }
          if (printed >= quantity) break;
        }
        if (printed < quantity) doc.addPage();
      }

      doc.save("etykiety.pdf");
    }

    updatePreview();
    updateStyle();
    handleEmoji();
  </script>
