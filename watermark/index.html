<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Watermark Studio</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0e0e0e;color:#e0e0e0;font-family:'Courier New',monospace;min-height:100vh;padding:20px}
  h1{font-size:1.1rem;letter-spacing:.3em;text-transform:uppercase;color:#fff;margin-bottom:4px}
  .sub{font-size:.65rem;color:#555;letter-spacing:.15em;margin-bottom:20px}
  .tabs{display:flex;gap:2px;margin-bottom:16px}
  .tab{padding:6px 18px;background:#1a1a1a;border:1px solid #333;cursor:pointer;font-family:inherit;font-size:.75rem;letter-spacing:.1em;color:#777;transition:.15s}
  .tab.on{background:#222;border-color:#666;color:#fff}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:700px){.row{grid-template-columns:1fr}}
  .panel{background:#141414;border:1px solid #252525;padding:14px}
  .panel h2{font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:#555;margin-bottom:12px;border-bottom:1px solid #1e1e1e;padding-bottom:6px}
  label{font-size:.7rem;color:#888;display:block;margin-bottom:3px;letter-spacing:.05em}
  select,input[type=range],input[type=file],input[type=number]{width:100%;background:#0e0e0e;border:1px solid #2a2a2a;color:#ddd;padding:5px 8px;font-family:inherit;font-size:.75rem;margin-bottom:10px}
  input[type=range]{padding:4px 0;accent-color:#c8a;cursor:pointer}
  .wm-btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .wm-btn{padding:5px 12px;background:#1a1a1a;border:1px solid #333;cursor:pointer;font-family:inherit;font-size:.7rem;color:#999;transition:.15s;letter-spacing:.05em}
  .wm-btn.on{border-color:#c8a;color:#c8a;background:#1e1a18}
  .wm-btn:hover{border-color:#555;color:#ccc}
  .preview-wrap{position:relative;width:100%;aspect-ratio:1;background:#0a0a0a;border:1px solid #1e1e1e;overflow:hidden;display:flex;align-items:center;justify-content:center}
  canvas{max-width:100%;max-height:100%;display:block}
  .no-img{font-size:.65rem;color:#333;letter-spacing:.1em;text-align:center}
  .dl-btn{width:100%;padding:8px;background:#1a1a1a;border:1px solid #4a3;color:#4a3;font-family:inherit;font-size:.75rem;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;transition:.15s;margin-top:8px}
  .dl-btn:hover{background:#1e2a1a;border-color:#6c5}
  .dl-btn:disabled{opacity:.3;cursor:default}
  .val{display:inline-block;width:32px;text-align:right;color:#aaa;font-size:.7rem}
  .adv-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
  .note{font-size:.62rem;color:#444;margin-top:-6px;margin-bottom:10px;line-height:1.4}
  input[type=file]{padding:4px;cursor:pointer}
  .upload-zone{border:1px dashed #333;padding:10px;text-align:center;cursor:pointer;margin-bottom:10px;transition:.15s}
  .upload-zone:hover{border-color:#666}
  .upload-zone label{cursor:pointer;color:#777;font-size:.7rem;margin:0}
  #mainUpload{display:none}
  .sect{margin-bottom:12px}
</style>
</head>
<body>
<h1>AI Watermark Studio</h1>
<div class="sub">forensic authenticity tools</div>

<div class="tabs">
  <button class="tab on" onclick="setMode('simple')">Simple</button>
  <button class="tab" onclick="setMode('advanced')">Advanced</button>
</div>

<div class="row">
  <div>
    <!-- UPLOAD -->
    <div class="panel" style="margin-bottom:12px">
      <h2>Source Image</h2>
      <div class="upload-zone" onclick="document.getElementById('mainUpload').click()">
        <label id="uploadLabel">Click to upload image</label>
      </div>
      <input type="file" id="mainUpload" accept="image/*" onchange="loadImg(this)">
      <p class="note">Videos not supported. JPG/PNG/WEBP only.</p>
    </div>

    <!-- SIMPLE CONTROLS -->
    <div id="simplePane" class="panel">
      <h2>Watermark</h2>
      <label>AI Source</label>
      <div class="wm-btns">
        <button class="wm-btn on" data-wm="gemini" onclick="pickWm(this,'gemini')">Gemini</button>
        <button class="wm-btn" data-wm="chatgpt" onclick="pickWm(this,'chatgpt')">ChatGPT</button>
        <button class="wm-btn" data-wm="grok" onclick="pickWm(this,'grok')">Grok</button>
        <button class="wm-btn" data-wm="none" onclick="pickWm(this,'none')">None</button>
      </div>

      <div id="tintCtrl" style="display:none" class="sect">
        <label>Tint Intensity <span class="val" id="tintVal">20</span>%</label>
        <input type="range" id="tintRange" min="5" max="80" value="20" oninput="document.getElementById('tintVal').textContent=this.value;render()">
      </div>

      <div id="grokNote" style="display:none" class="note" style="color:#555">
        Grok doesn't watermark images. (It's bad anyway.)
      </div>

    </div>

    <!-- ADVANCED CONTROLS -->
    <div id="advPane" class="panel" style="display:none">
      <h2>Watermark</h2>
      <label>AI Source (presets)</label>
      <div class="wm-btns">
        <button class="wm-btn on" data-wm="gemini" onclick="pickWm(this,'gemini')">Gemini</button>
        <button class="wm-btn" data-wm="chatgpt" onclick="pickWm(this,'chatgpt')">ChatGPT</button>
        <button class="wm-btn" data-wm="grok" onclick="pickWm(this,'grok')">Grok</button>
        <button class="wm-btn" data-wm="none" onclick="pickWm(this,'none')">None</button>
      </div>

      <div id="tintCtrlAdv" style="display:none" class="sect">
        <label>Tint Intensity <span class="val" id="tintValAdv">20</span>%</label>
        <input type="range" id="tintRangeAdv" min="5" max="80" value="20" oninput="document.getElementById('tintValAdv').textContent=this.value;render()">
      </div>

      <div id="grokNoteAdv" style="display:none" class="note">Grok doesn't watermark. (It's bad anyway.)</div>

      <div class="sect">
        <label>Custom Watermark Image</label>
        <input type="file" id="wmFileAdv" accept="image/*" onchange="loadWmFile(this)">
      </div>

      <div class="adv-grid">
        <div>
          <label>X from right (px) <span class="val" id="xVal">55</span></label>
          <input type="range" id="xPos" min="0" max="1000" value="55" oninput="document.getElementById('xVal').textContent=this.value;render()">
        </div>
        <div>
          <label>Y from bottom (px) <span class="val" id="yVal">55</span></label>
          <input type="range" id="yPos" min="0" max="1000" value="55" oninput="document.getElementById('yVal').textContent=this.value;render()">
        </div>
        <div>
          <label>Opacity <span class="val" id="opVal">90</span>%</label>
          <input type="range" id="opRange" min="5" max="100" value="90" oninput="document.getElementById('opVal').textContent=this.value;render()">
        </div>
        <div>
          <label>Scale <span class="val" id="scVal">100</span>%</label>
          <input type="range" id="scRange" min="10" max="300" value="100" oninput="document.getElementById('scVal').textContent=this.value;render()">
        </div>
      </div>
    </div>
  </div>

  <!-- PREVIEW -->
  <div>
    <div class="panel">
      <h2>Preview</h2>
      <div class="preview-wrap">
        <canvas id="cv"></canvas>
        <div class="no-img" id="noImgMsg">No image loaded</div>
      </div>
      <button class="dl-btn" id="dlBtn" disabled onclick="download()">Download watermarked image</button>
    </div>
  </div>
</div>

<script>
let mode='simple', wm='gemini', srcImg=null, wmImg=null;

const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');

const PRESETS={
  gemini:{tint:null,noWm:false},
  chatgpt:{tint:'#fcba03',noWm:false},
  grok:{noWm:true},
  none:{noWm:true}
};

const geminiImg=new Image();
geminiImg.src='gemini.png';
geminiImg.onload=()=>render();

function setMode(m){
  mode=m;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  event.target.classList.add('on');
  document.getElementById('simplePane').style.display=m==='simple'?'':'none';
  document.getElementById('advPane').style.display=m==='advanced'?'':'none';
  render();
}

function pickWm(btn,name){
  document.querySelectorAll('.wm-btn').forEach(b=>b.classList.remove('on'));
  document.querySelectorAll('.wm-btn[data-wm="'+name+'"]').forEach(b=>b.classList.add('on'));
  wm=name;
  const p=PRESETS[wm];
  // tint controls
  ['tintCtrl','tintCtrlAdv'].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.style.display=(p&&p.tint)?'block':'none';
  });
  ['grokNote','grokNoteAdv'].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.style.display=(p&&p.noWm)?'block':'none';
  });
  // sync advanced position sliders to 55px from edges default
  if(mode==='advanced'){
    document.getElementById('xPos').value=55;
    document.getElementById('yPos').value=55;
    document.getElementById('xVal').textContent=55;
    document.getElementById('yVal').textContent=55;
  }
  render();
}

function loadImg(inp){
  if(!inp.files[0]) return;
  const r=new FileReader();
  r.onload=e=>{
    const i=new Image();
    i.onload=()=>{srcImg=i;render()};
    i.src=e.target.result;
  };
  r.readAsDataURL(inp.files[0]);
  document.getElementById('uploadLabel').textContent=inp.files[0].name;
}

function loadWmFile(inp){
  if(!inp.files[0]){wmImg=null;render();return;}
  const r=new FileReader();
  r.onload=e=>{
    const i=new Image();
    i.onload=()=>{wmImg=i;render()};
    i.src=e.target.result;
  };
  r.readAsDataURL(inp.files[0]);
}

function render(){
  if(!srcImg){
    document.getElementById('noImgMsg').style.display='';
    cv.style.display='none';
    document.getElementById('dlBtn').disabled=true;
    return;
  }
  document.getElementById('noImgMsg').style.display='none';
  cv.style.display='block';
  document.getElementById('dlBtn').disabled=false;

  const W=srcImg.naturalWidth, H=srcImg.naturalHeight;
  cv.width=W; cv.height=H;
  ctx.drawImage(srcImg,0,0);

  const p=PRESETS[wm]||{};

  // Tint for ChatGPT
  if(p.tint){
    const tintEl=mode==='advanced'?document.getElementById('tintRangeAdv'):document.getElementById('tintRange');
    const alpha=(parseInt(tintEl.value)/100);
    ctx.globalAlpha=alpha;
    ctx.fillStyle=p.tint;
    ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=1;
  }

  // Watermark image
  if(!p.noWm){
    const imgToDraw = wmImg || (wm==='gemini' ? geminiImg : null);
    if(imgToDraw && imgToDraw.complete && imgToDraw.naturalWidth){
      const scaleW=Math.max(1,W/1000);
      const baseSize=46*scaleW;
      const edgeX=55*scaleW, edgeY=55*scaleW;
      let op=90, cx, cy, ww=baseSize, wh=baseSize;
      if(mode==='advanced'){
        const scPct=parseInt(document.getElementById('scRange').value);
        op=parseInt(document.getElementById('opRange').value);
        const xFromRight=parseInt(document.getElementById('xPos').value);
        const yFromBottom=parseInt(document.getElementById('yPos').value);
        cx=W-xFromRight;
        cy=H-yFromBottom;
        ww=baseSize*(scPct/100);
        wh=baseSize*(scPct/100);
      } else {
        cx=W-edgeX; cy=H-edgeY;
      }
      ctx.globalAlpha=op/100;
      ctx.drawImage(imgToDraw, cx-ww/2, cy-wh/2, ww, wh);
      ctx.globalAlpha=1;
    }
  }
}

function rand5(){
  return Math.random().toString(36).slice(2,7);
}

function download(){
  if(!srcImg) return;
  const mainInp=document.getElementById('mainUpload');
  const orig=mainInp.files[0]?mainInp.files[0].name:'image.png';
  const ext=orig.lastIndexOf('.')>-1?orig.slice(orig.lastIndexOf('.')):'png';
  const base=orig.slice(0,orig.length-ext.length)||'image';
  const fname=base+'-watermarked-'+rand5()+ext;
  const a=document.createElement('a');
  a.href=cv.toDataURL('image/png');
  a.download=fname;
  a.click();
}
</script>
</body>
</html>
